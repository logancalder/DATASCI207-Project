[project]
name = "datasci207-project"
version = "0.1.0"
description = "Predicting NFL fourth-down conversion probability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab",
    "keras",
    "matplotlib",
    "nflreadpy",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "seaborn",
    "tensorflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfl_project"]
